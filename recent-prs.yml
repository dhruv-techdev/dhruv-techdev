name: Update recent PRs

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/recent-prs.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PR table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const LIMIT = 10;

            // All your PRs across GitHub, newest activity first (skips this profile repo)
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `is:pr author:${owner} -repo:${owner}/${owner}`,
              sort: 'updated',
              order: 'desc',
              per_page: LIMIT,
            });

            const esc = s => s.replace(/\|/g, '\\|').replace(/[<>]/g, '');
            const rows = data.items.map(pr => {
              const repo = pr.repository_url.split('/repos/')[1];
              const status = pr.pull_request?.merged_at ? '🟣 Merged'
                           : pr.state === 'open'         ? '🟢 Open'
                           :                               '🔴 Closed';
              const date = pr.updated_at.slice(0, 10);
              return `| ${status} | [${esc(pr.title)}](${pr.html_url}) | [${repo}](https://github.com/${repo}) | ${date} |`;
            });

            const table = rows.length
              ? ['| Status | Pull Request | Repo | Updated |',
                 '|:--|:--|:--|:--|', ...rows].join('\n')
              : '_No pull requests yet._';

            const stamp = `\n\n<sub>Last refreshed: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC</sub>`;

            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- PRS:START -->[\s\S]*<!-- PRS:END -->/,
              `<!-- PRS:START -->\n${table}${stamp}\n<!-- PRS:END -->`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update recent PRs" && git push)
